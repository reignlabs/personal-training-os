    source: "TEST (clinician exam) + USER (PR-FUNC)"
    evidence_label: [TEST, PR-FUNC, UNC]
    source_reference: "HH §1.1, §2.2, §10 S-1. Right triceps 3/5 (4/27/2026) vs 4/5 (5/6/2026), unreconciled; user confirms 3/5 in Sept 2026; weakness builds within a set."
