# class: PERSONAL
# version: v0 draft 0.1 (2026-09-23)
# status: DRAFT. HC-01 is ACTIVE. HC-02 is ACTIVE with scope pending (B4).
#         SC-01 is ACTIVE with parameters pending (B5). SC-02..SC-05 are CANDIDATES awaiting your decision (B4/B5).
# companion: PERSONAL_user_profile.yaml references these IDs; constraints are defined only here (D-012).
#
# RULES FOR THIS FILE (D-006, D-013, D-014)
#  1. Only constraints stated by the USER, a CLINICIAN, or a TRAINER are recorded as active.
#  2. Rules written by Claude inside the Health Project (evidence_label AI-PLAN) are held as CANDIDATES.
#     They become active only if you adopt them. Once adopted, source becomes "USER (adopted from AI-PLAN)".
#  3. A diagnosis alone never creates a constraint. Diagnoses with no stated training implication are
#     recorded as CONTEXT in the profile, not here.
#  4. HARD = generator excludes or enforces automatically.
#     SOFT = generator adjusts scoring, selection, volume, intensity, ROM, frequency, or progression; does not prohibit.
#  5. Constraints are written against movement descriptions / tags. Exercise lists below are the current best
#     mapping against DATA exercise library v0 (103 rows) and are provisional until the Phase 3 tag dictionary
#     exists. Position-dependent matches are marked as such, never silently excluded.
#
# status vocabulary: ACTIVE | ACTIVE_SCOPE_PENDING | ACTIVE_PARAMETERS_PENDING | CANDIDATE_PENDING_USER | NOT_ADOPTED | RETIRED
# source vocabulary: USER | CLINICIAN | TRAINER | USER (adopted from AI-PLAN)
# HH = Personal_Training_Health_Profile_v0_1.md (Health Project handoff, 2026-09)

hard_constraints:

  - constraint_id: HC-01
    description: "No dips of any kind (parallel-bar, bench, or assisted)."
    affected_patterns: [vertical_push_bodyweight_dip, triceps_dominant_bodyweight_push]
    affected_exercises_if_known:
      library: "No dip rows exist in exercise library v0."
      equipment: "Apartment gym dip station EQ003 must not be used for dips. It may still be used for other purposes (e.g. elevated handles) unless you say otherwise."
    laterality: bilateral movement; reason is right-side (right triceps)
    source: USER
    evidence_label: PR-FUNC
    source_reference: "HH §9: 'Let's avoid any dips (in my case) since that is difficult for my triceps.'"
    reason: "User-reported difficulty due to right triceps."
    clinician_confirmed: false
    label_in_app: "Your exclusion (not a medical restriction)"
    status: ACTIVE
    confidence: HIGH
    review_needed: false

