        - {id: EX076, name: Traditional Plank, note: "forearm version would not be covered"}
        - {id: EX077, name: Marching Plank}
        - {id: EX078, name: Plank with a Reach}
        - {id: EX079, name: Around-the-World Plank}
        - {id: EX034, name: Renegade Row, note: "a moving high-plank exercise; in or out of scope depends on B4a"}
        - {id: EX032, name: Mountain Climbers, note: "a moving high-plank exercise; in or out of scope depends on B4a"}
      explicitly_not_covered_by_this_statement:
        - {id: EX001, name: Push-Up, note: "push-ups are not the same statement; tolerance UNKNOWN (B4b)"}
    laterality: bilateral position; reason is right-side (right triceps)
    source: USER
    evidence_label: PR-FUNC
    source_reference: "HH §9: push-up-position planks 'are difficult for me because of my right triceps'; exclusion accepted in DailyAbs."
    reason: "User-reported difficulty due to right triceps."
    clinician_confirmed: false
    label_in_app: "Your exclusion (not a medical restriction)"
    status: ACTIVE_SCOPE_PENDING
