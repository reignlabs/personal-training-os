    affected_exercises_if_known:
      pressing: [EX001 Push-Up, EX041 Dumbbell Floor Press, EX054 Dumbbell Bench Press, EX096 Single-Arm Dumbbell Bench Press,
                 EX070 See-Saw Incline Dumbbell Press, EX015 Kettlebell Overhead Press, EX071 Half-Kneeling Single-Arm KB Overhead Press,
                 EX062 Deficit Push-Up, EX063 Explosive Push-Up]
      complexes_with_press: [EX016 Single Arm Kettlebell Thruster, EX072 Thruster, EX099 Kettlebell Clean-to-Press, EX086 Turkish Get-Up]
      apartment_gym_machines: [EQ017 cable chest press, EQ019 cable shoulder press]
      triceps_isolation: "none in library v0"
