    reason: "Within-set fade is user-reported. The 'stop at first fade' rule was written by Claude, not a clinician or trainer."
    conflict_to_preserve: "Feb 2026 clinic history records 'not necessarily worse with activity' (HH §2.2)."
    status: CANDIDATE_PENDING_USER
    confidence: MEDIUM
    review_needed: true
    review_question: B5

