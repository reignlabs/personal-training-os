# ─────────────────────────────────────────────────────────────
PROGRESSION_GATES:
  # Specifies what information must exist before progression is CONSIDERED. Does not prescribe progression.
  # All thresholds (N exposures, etc.) are SYSTEM_DESIGN placeholders to be set in Phase 6.
  global_overrides:   # any one blocks progression pressure
    - "Active hard constraint conflict (exercise becomes ineligible, not progressed)"
    - "STOPPED_SYMPTOM or UNCOMFORTABLE on this exercise in the last N exposures, until user review"
    - "R-06 = yes, or R-02 = low, for the session in question"
    - "SESSION_CAPACITY below_usual on the logged exposure being evaluated (that exposure is not evidence either way)"
    - "Movement quality: TECHNIQUE_DIFFICULTY on the last exposure"
  context_modifiers:
    - "During the deficit (RF-01), failure to progress is recorded as 'held', not as regression (SYSTEM_DESIGN proposal)"
  per_dimension_requirements:
    LOAD:
      - "at least N logged exposures at the current load"
      - "all prescribed reps completed with GOOD or TOO_EASY"
      - "a smaller load increment is actually available (EQM / home inventory)"
      - "right-arm-involved: right side completed target reps with no RIGHT_ARM_FADE before the target rep; left-side success never counts for the right"
    REPS:
      - "current load logged at least N times with GOOD or TOO_EASY"
      - "rep ceiling for the exercise role defined (Phase 5)"
      - "right-arm-involved: fade rep history known"
    SETS:
      - "weekly exposure for the pattern known, INCLUDING Alloy sessions"
      - "no downward readiness trend across the week"
      - "SC-01 parameters set, if the exercise involves the right triceps"
    ROM:
      - "no UNCOMFORTABLE flags at current ROM"
      - "user confirms comfort at larger ROM (never assumed)"
    TEMPO:
      - "effort GOOD at current tempo; no TECHNIQUE_DIFFICULTY"
    COMPLEXITY:
      - "prerequisite (simpler) variant stable for N exposures"
      - "no TECHNIQUE_DIFFICULTY in the last 2 exposures"
      - "target variant passes all hard constraints and equipment checks"
    UNILATERAL_DEMAND:
      - "bilateral or supported version stable"
      - "per-side log exists"
      - "for right-arm-involved moves: SC-01 parameters set (uneven per-side dosing allowed or not)"

# ─────────────────────────────────────────────────────────────
MONITORING_VARIABLES:   # recorded, never interpreted by the generator
  - {id: M-01, variable: "right_arm_fade_rep by exercise", source: "RIGHT_ARM_FADE flag"}
