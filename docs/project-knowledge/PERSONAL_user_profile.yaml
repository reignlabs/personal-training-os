# ─────────────────────────────────────────────────────────────
READINESS_VARIABLES:   # V0 pre-workout check-in. Target: under 30 seconds. SYSTEM_DESIGN selection, justified by HH.
  questions:
    - {id: R-01, question: "Minutes available today", type: integer, why: "architecture input (session length); not a readiness score"}
    - {id: R-02, question: "Energy today", options: [low, normal, high], why: "HH's main capacity issue is general low energy (HH §13)"}
    - {id: R-03, question: "Sleep last night", options: [poor, ok, good], why: "sleep deficit is a documented recovery factor (HH §2.6); currency UNC"}
    - {id: R-04, question: "Right arm today vs usual", options: [worse, same, better], why: "the one variable that directly changes push/triceps selection and dosing (SC-01)"}
    - {id: R-05, question: "Anything too sore to load today?", options: [none, upper, lower, specific_area], why: "prevents stacking on sore tissue after Alloy sessions"}
    - {id: R-06, question: "Feeling unwell or different from your usual today?", options: [no, yes], why: "single gate covering illness (on immunosuppression) and any symptom change. The app does not ask which symptom and does not interpret. If yes, you choose: normal / lighter / skip."}
    - {id: R-07, question: "Ate per plan 2-3 h before?", options: [yes, no], why: "fueling is the leading hypothesis for the capacity drop (HH §13)", sunset: "remove when OQ-02 is resolved"}
  excluded_from_v0_and_why:
    - "Eyelid droop / double vision ratings, MG-ADL, GI, weight, protein, alcohol, tightness scales: medical or nutrition monitoring. Belongs in the Health Project (D-017)."
    - "Days since tirzepatide dose: derivable from calendar; not asked."
    - "Motivation: no evidence it changes the right workout for you; can add later."

# ─────────────────────────────────────────────────────────────
DURING_WORKOUT_FEEDBACK:
  # One effort rating per exercise (required) + optional flags. Each code maps to exactly one problem class
  # so the future generator can tell load problems apart from selection, tolerance, preference, and fatigue problems.
  effort_rating:   # required, per exercise (per side for right-arm-involved exercises)
    - {code: TOO_EASY,  problem_class: load}
    - {code: GOOD,      problem_class: none}
    - {code: HARD,      problem_class: none, note: "intended top end of effort, not a problem"}
    - {code: TOO_HARD,  problem_class: load}
  flags:   # optional, any number
    - {code: RIGHT_ARM_FADE, fields: [rep_number], problem_class: asymmetry_tolerance, note: "recorded, not interpreted; continues the DailyArms weak-arm log"}
    - {code: TECHNIQUE_DIFFICULTY, problem_class: exercise_selection_complexity}
    - {code: UNCOMFORTABLE, fields: [location_optional], problem_class: movement_tolerance}
    - {code: STOPPED_SYMPTOM, fields: [free_text_optional], problem_class: movement_tolerance_or_health, note: "recorded, not interpreted (D-006). Exercise is held from auto-selection until you review it."}
    - {code: DISLIKE, problem_class: preference}
    - {code: PREFER, problem_class: preference}
    - {code: EQUIPMENT_ISSUE, fields: [free_text_optional], problem_class: environment, note: "e.g. station busy, weight missing. Keeps equipment problems from being read as exercise problems."}
  session_level:   # post-session, one tap
    - {code: SESSION_CAPACITY, options: [below_usual, usual, above_usual], problem_class: general_fatigue}
  disambiguation_rules:   # data semantics, not generator policy
    - "TOO_HARD alone = load problem. TOO_HARD + UNCOMFORTABLE = tolerance problem, not load."
    - "TOO_HARD across most exercises + SESSION_CAPACITY below_usual = general fatigue, not individual load problems."
    - "DISLIKE never lowers load; it lowers selection preference only."
    - "RIGHT_ARM_FADE is never read as TOO_HARD for the left side."

