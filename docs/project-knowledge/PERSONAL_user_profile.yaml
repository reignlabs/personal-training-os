# supersedes: Phase 1 template of the same name (chat 00)
# companion: PERSONAL_constraints.yaml (constraint definitions; this file only references IDs, D-012)
#
# HOW TO READ THIS FILE
#  item_class (the classification you asked for, plus one addition):
#    HARD_CONSTRAINT | SOFT_CONSTRAINT | CURRENT_CAPABILITY | FUNCTIONAL_LIMITATION | ASYMMETRY |
#    MONITORING_VARIABLE | PREFERENCE | GOAL | OPEN_QUESTION |
#    CONTEXT  <- added (D-014): a health fact kept for explanation records only. It has NO effect on selection.
#  evidence_label: copied unchanged from the Health handoff (DX, TEST, CLIN, PR-SYM, PR-FUNC, PR-GOAL, HIST, CUR, UNC, UNK, AI-PLAN).
#  UNKNOWN never means "normal" or "no problem". The generator must treat UNKNOWN as "not established".
#  Alloy evidence classes (ALLOY_DOCUMENTED etc.) do not apply to personal data. Nothing here is an Alloy claim.
#  Tags marked SYSTEM_DESIGN are proposals this project authored, not facts about you.
#
# SOURCES
#  HH   = Personal_Training_Health_Profile_v0_1.md (Health Project handoff, 2026-09). Authoritative for medical context.
