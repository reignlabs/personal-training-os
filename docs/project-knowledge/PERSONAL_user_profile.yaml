#  EQM  = chat "02 | EQUIPMENT MODEL" outputs (equipment_library.json, 2026-09-23)
#  ARCH = chat "00 | PROJECT ARCHITECTURE" (charter, APP_V0_SCOPE)
#  RES  = RAW Alloy research files R1-R4 (only where noted)

